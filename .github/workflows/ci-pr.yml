# ci-pr.yml — PR / branch CI.
#
# Brings up the full layered mundus on a local replica inside ONE
# runner. The four pipeline stages (bootstrap-infra, publish-artifacts,
# install-mundus, verify-mundus) run sequentially in the same job
# because the local replica is ephemeral — canister ids minted in one
# job don't exist in the next.
#
# For staging / ic the same four stages run as separate reusable
# workflows (see ci-main.yml) since the canisters are long-lived.

name: CI (PR)

on:
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"
  DFX_VERSION: "0.32.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e cli/ ruff black
      - name: Ruff
        run: ruff check src/ scripts/ cli/
        continue-on-error: true
      - name: Black --check
        run: black --check src/ scripts/ cli/
        continue-on-error: true
      - name: actionlint
        uses: raven-actions/actionlint@v2

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -e cli/
          pip install -r requirements.txt
          pip install pytest
      - name: CLI unit tests
        run: pytest -v cli/tests/ || true
      - name: Extension privilege ratchet
        # Blocking on purpose: these are pure source scans and in-memory unit
        # tests with no canister or DB, so a failure here is a real
        # regression. The exemption list may only shrink, no extension may
        # take the caller's identity from its own call args, every bridge verb
        # must keep checking the caller's operation host-side, and no verb may
        # be dispatched without its call origin.
        run: |
          python3 scripts/declare_extension_runtime.py --check
          pytest -q tests/backend/test_extension_caller_identity.py \
                    tests/backend/test_sandbox_exemption_ratchet.py \
                    tests/backend/test_extension_manifest_contract.py \
                    tests/backend/test_extension_bridge.py \
                    tests/backend/test_extension_bridge_verbs.py \
                    tests/backend/test_extension_owned_entities.py \
                    tests/backend/test_land_bridge.py \
                    tests/backend/test_extension_grants.py \
                    tests/backend/test_notification_bridge.py \
                    tests/backend/test_console_bridge.py \
                    tests/backend/test_async_bridge.py \
                    tests/backend/test_treasury_bridge.py \
                    tests/backend/test_procurement_bridge.py \
                    tests/backend/test_procurement_sandboxed.py \
                    tests/backend/test_justice_bridge.py \
                    tests/backend/test_justice_sandboxed.py \
                    tests/backend/test_sandbox_package_bundle.py \
                    tests/backend/department_docs/ \
                    tests/backend/test_time_utils.py \
                    tests/backend/test_call_origin.py \
                    tests/backend/test_ggg_sdk_json_shim.py
      - name: Cedar schema and policy drift
        # Two copies of the same rules that must never drift apart, because a
        # stale one silently changes what a realm enforces: the generated schema
        # against the live entity definitions, and the embedded policy text the
        # canister actually runs against the .cedar files it mirrors.
        run: |
          python3 scripts/generate_cedar_schema.py --check
          python3 scripts/sync_cedar_policies.py --check
      - name: Validate descriptors
        run: |
          for f in deployment-descriptors/*-mundus*.yml; do
            echo "::group::$f"
            python3 -c "import yaml,sys; yaml.safe_load(open('$f'))"
            echo "::endgroup::"
          done

  layered-e2e:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dfx
        run: |
          DFX_VERSION=0.32.0
          curl -fsSL "https://github.com/dfinity/sdk/releases/download/${DFX_VERSION}/dfx-${DFX_VERSION}-x86_64-linux.tar.gz" -o /tmp/dfx.tar.gz
          tar -xzf /tmp/dfx.tar.gz -C /usr/local/bin
          rm /tmp/dfx.tar.gz
          dfx --version

      - name: Install realms CLI + Python deps
        run: |
          pip install -e cli/
          pip install pyyaml

      - name: Start local replica
        run: |
          dfx start --background --clean --host 127.0.0.1:4943
          sleep 3
          dfx ping

      - name: Run all four stages on the local mundus
        run: |
          python3 scripts/ci_install_mundus.py \
              --file deployment-descriptors/local-mundus.yml \
              --stages 0,1,2,3

      # Run realm_installer API contract tests against the
      # live replica that stages 0-3 just bootstrapped.
      - name: realm_installer API tests
        run: python3 tests/integration/test_realm_installer_api.py

      # Cross-quarter addressing end-to-end: single-canister endpoints plus a
      # real inter-canister sync_quarters round-trip against a 2nd realm_backend.
      - name: cross-quarter live integration tests
        run: python3 tests/integration/test_cross_quarter_live.py

      - name: Stop local replica
        if: always()
        run: dfx stop || true
