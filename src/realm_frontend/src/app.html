<!doctype html>
<html lang="%lang%">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="/images/logo.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="keywords" content="Governance,Blockchain,ICP" />
	<!-- Git commit hash for deployment verification - populated during build -->
	<meta name="commit-hash" content="COMMIT_HASH_PLACEHOLDER" />
	<meta name="commit-datetime" content="COMMIT_DATETIME_PLACEHOLDER" />
	<meta name="version" content="VERSION_PLACEHOLDER" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&amp;family=Inter:wght@300;400;500;600;700;800&amp;display=swap"
		rel="stylesheet" />
	<script src="/canister_ids.js"></script>
	<style>
		#app-splash {
			position: fixed;
			inset: 0;
			z-index: 9999;
			display: flex;
			justify-content: center;
			align-items: center;
			background: #ffffff;
		}

		#app-splash .globe-stage {
			position: relative;
			width: 72px;
			height: 72px;
			display: grid;
			place-items: center;
			color: #a3a3a3;
			animation: app-splash-breathe 3.6s ease-in-out infinite;
		}

		#app-splash .globe-glow {
			position: absolute;
			inset: -18%;
			border-radius: 50%;
			background: radial-gradient(circle, rgba(163, 163, 163, 0.16) 0%, rgba(163, 163, 163, 0.04) 42%, transparent 70%);
		}

		#app-splash .globe-svg {
			position: relative;
			width: 72px;
			height: 72px;
			overflow: visible;
		}

		#app-splash .globe-spin {
			transform-origin: 32px 32px;
			animation: app-splash-rotate 18s linear infinite;
		}

		@keyframes app-splash-rotate {
			to {
				transform: rotate(360deg);
			}
		}

		@keyframes app-splash-breathe {
			0%,
			100% {
				transform: scale(0.97);
				opacity: 0.88;
			}
			50% {
				transform: scale(1);
				opacity: 1;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			#app-splash .globe-spin,
			#app-splash .globe-stage {
				animation: none;
			}
		}
	</style>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="bg-gray-50 antialiased">
	<div style="display: contents">
		<div id="app-splash" aria-hidden="true">
			<div class="globe-stage">
				<span class="globe-glow"></span>
				<svg class="globe-svg" viewBox="0 0 64 64" aria-hidden="true">
					<defs>
						<radialGradient id="app-splash-core" cx="36%" cy="30%" r="68%">
							<stop offset="0%" stop-color="#c4c4c4" stop-opacity="0.28" />
							<stop offset="70%" stop-color="#e8e8e8" stop-opacity="0.08" />
							<stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
						</radialGradient>
					</defs>
					<circle cx="32" cy="32" r="26" fill="url(#app-splash-core)" />
					<g class="globe-spin">
						<circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="1" opacity="0.38" />
						<ellipse cx="32" cy="32" rx="28" ry="11" fill="none" stroke="currentColor" stroke-width="1" opacity="0.58" />
						<ellipse cx="32" cy="32" rx="28" ry="20" fill="none" stroke="currentColor" stroke-width="1" opacity="0.28" />
						<ellipse cx="32" cy="32" rx="11" ry="28" fill="none" stroke="currentColor" stroke-width="1" opacity="0.42" />
						<ellipse cx="32" cy="32" rx="22" ry="28" fill="none" stroke="currentColor" stroke-width="1" opacity="0.22" />
						<circle cx="32" cy="6" r="2.25" fill="currentColor" opacity="0.78" />
					</g>
				</svg>
			</div>
		</div>
		%sveltekit.body%
	</div>
</body>

</html>
