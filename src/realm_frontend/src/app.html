<!doctype html>
<html lang="%lang%">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="/images/logo.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="keywords" content="Governance,Blockchain,ICP" />
	<!-- Git commit hash for deployment verification - populated during build -->
	<meta name="commit-hash" content="COMMIT_HASH_PLACEHOLDER" />
	<meta name="commit-datetime" content="COMMIT_DATETIME_PLACEHOLDER" />
	<meta name="version" content="VERSION_PLACEHOLDER" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&amp;family=Inter:wght@300;400;500;600;700;800&amp;display=swap"
		rel="stylesheet" />
	<script src="/canister_ids.js"></script>
	<style>
		#app-splash {
			position: fixed;
			inset: 0;
			z-index: 9999;
			display: flex;
			justify-content: center;
			align-items: center;
			background: #ffffff;
		}

		#app-splash .loading-dots {
			display: flex;
			gap: 0.5rem;
			align-items: center;
		}

		#app-splash .loading-dots span {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: #a3a3a3;
			animation: app-splash-dot-pulse 1.4s ease-in-out infinite;
		}

		#app-splash .loading-dots span:nth-child(2) {
			animation-delay: 0.2s;
		}

		#app-splash .loading-dots span:nth-child(3) {
			animation-delay: 0.4s;
		}

		@keyframes app-splash-dot-pulse {
			0%,
			80%,
			100% {
				opacity: 0.3;
				transform: scale(0.8);
			}

			40% {
				opacity: 1;
				transform: scale(1);
			}
		}
	</style>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="bg-gray-50 antialiased">
	<div style="display: contents">
		<div id="app-splash" aria-hidden="true">
			<div class="loading-dots">
				<span></span>
				<span></span>
				<span></span>
			</div>
		</div>
		%sveltekit.body%
	</div>
</body>

</html>
