<!doctype html>
<html lang="%lang%">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="/custom/logo.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="keywords" content="Governance,Blockchain,ICP" />
	<!-- Git commit hash for deployment verification - populated during build -->
	<meta name="commit-hash" content="COMMIT_HASH_PLACEHOLDER" />
	<meta name="commit-datetime" content="COMMIT_DATETIME_PLACEHOLDER" />
	<meta name="version" content="VERSION_PLACEHOLDER" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&amp;family=Inter:wght@300;400;500;600;700;800&amp;display=swap"
		rel="stylesheet" />
	<script src="/canister_ids.js"></script>
	<style>
		#app-splash {
			position: fixed;
			inset: 0;
			z-index: 9999;
			display: flex;
			justify-content: center;
			align-items: center;
			background: #ffffff;
			/* Visual only. A leftover splash must not steal mouse hits while
			   Tab can still reach the focused control underneath. */
			pointer-events: none;
		}

		#app-splash .globe-stage {
			position: relative;
			width: 88px;
			height: 88px;
			display: grid;
			place-items: center;
			color: #8a8a8a;
		}

		#app-splash .globe-glow {
			position: absolute;
			inset: -28%;
			border-radius: 50%;
			background: radial-gradient(circle, rgba(115, 115, 115, 0.22) 0%, rgba(163, 163, 163, 0.08) 38%, transparent 68%);
			animation: app-splash-glow 2.4s ease-in-out infinite;
		}

		#app-splash .globe-halo {
			position: absolute;
			inset: -10%;
			border-radius: 50%;
			background: conic-gradient(from 0deg, transparent 0 68%, rgba(64, 64, 64, 0.22) 82%, rgba(245, 245, 245, 0.55) 90%, rgba(64, 64, 64, 0.16) 96%, transparent 100%);
			-webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
			mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
			animation: app-splash-spin 4.6s linear infinite;
		}

		#app-splash .globe-svg {
			position: relative;
			width: 88px;
			height: 88px;
			overflow: visible;
		}

		#app-splash .globe-fill {
			animation: app-splash-core 2.4s ease-in-out infinite;
		}

		#app-splash .globe-rim {
			opacity: 0.42;
			stroke-dasharray: 22 154;
			animation: app-splash-dash 3.8s linear infinite;
		}

		#app-splash .globe-yaw {
			transform-origin: 32px 32px;
			animation: app-splash-spin 8.5s linear infinite;
		}

		#app-splash .globe-roll {
			transform-origin: 32px 32px;
			animation: app-splash-spin-rev 13s linear infinite;
		}

		#app-splash .globe-orbit {
			transform-origin: 32px 32px;
			animation: app-splash-spin 3.4s linear infinite;
		}

		#app-splash .globe-orbit.delayed {
			animation-duration: 5.6s;
			animation-direction: reverse;
		}

		#app-splash .orbit-dot,
		#app-splash .orbit-mote {
			transform-box: fill-box;
			transform-origin: center;
		}

		#app-splash .orbit-dot {
			filter: drop-shadow(0 0 2.5px rgba(64, 64, 64, 0.45));
			animation: app-splash-foreshorten 3.4s ease-in-out infinite;
		}

		#app-splash .orbit-mote {
			opacity: 0.55;
			animation: app-splash-foreshorten 5.6s ease-in-out infinite reverse;
		}

		@keyframes app-splash-spin {
			to {
				transform: rotate(360deg);
			}
		}

		@keyframes app-splash-spin-rev {
			to {
				transform: rotate(-360deg);
			}
		}

		@keyframes app-splash-dash {
			to {
				stroke-dashoffset: -176;
			}
		}

		@keyframes app-splash-glow {
			0%,
			100% {
				transform: scale(0.92);
				opacity: 0.55;
			}
			50% {
				transform: scale(1.08);
				opacity: 1;
			}
		}

		@keyframes app-splash-core {
			0%,
			100% {
				opacity: 0.7;
			}
			50% {
				opacity: 1;
			}
		}

		@keyframes app-splash-foreshorten {
			0%,
			100% {
				transform: scale(0.55);
				opacity: 0.28;
			}
			50% {
				transform: scale(1.2);
				opacity: 1;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			#app-splash .globe-yaw,
			#app-splash .globe-roll,
			#app-splash .globe-orbit,
			#app-splash .globe-halo,
			#app-splash .globe-rim,
			#app-splash .globe-glow,
			#app-splash .globe-fill,
			#app-splash .orbit-dot,
			#app-splash .orbit-mote {
				animation: none;
			}
		}
	</style>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="bg-gray-50 antialiased">
	<div style="display: contents">
		<div id="app-splash" aria-hidden="true">
			<div class="globe-stage">
				<span class="globe-glow"></span>
				<span class="globe-halo"></span>
				<svg class="globe-svg" viewBox="0 0 64 64" aria-hidden="true">
					<defs>
						<radialGradient id="app-splash-core" cx="34%" cy="28%" r="72%">
							<stop offset="0%" stop-color="#d4d4d4" stop-opacity="0.42" />
							<stop offset="55%" stop-color="#e7e7e7" stop-opacity="0.12" />
							<stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
						</radialGradient>
						<clipPath id="app-splash-clip">
							<circle cx="32" cy="32" r="27.4" />
						</clipPath>
					</defs>
					<circle class="globe-fill" cx="32" cy="32" r="27" fill="url(#app-splash-core)" />
					<circle class="globe-rim" cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="1" />
					<g class="globe-yaw" clip-path="url(#app-splash-clip)">
						<ellipse cx="32" cy="32" rx="11" ry="28" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5" />
						<ellipse cx="32" cy="32" rx="22" ry="28" fill="none" stroke="currentColor" stroke-width="1" opacity="0.28" />
						<ellipse cx="32" cy="32" rx="5" ry="28" fill="none" stroke="currentColor" stroke-width="1" opacity="0.16" />
					</g>
					<g class="globe-roll" clip-path="url(#app-splash-clip)">
						<ellipse cx="32" cy="32" rx="28" ry="11" fill="none" stroke="currentColor" stroke-width="1" opacity="0.62" />
						<ellipse cx="32" cy="32" rx="28" ry="20" fill="none" stroke="currentColor" stroke-width="1" opacity="0.32" />
						<line x1="4" y1="32" x2="60" y2="32" stroke="currentColor" stroke-width="1" opacity="0.32" />
					</g>
					<g class="globe-orbit">
						<circle class="orbit-dot" cx="32" cy="4.2" r="2.15" fill="currentColor" />
					</g>
					<g class="globe-orbit delayed">
						<circle class="orbit-mote" cx="32" cy="4.2" r="1.15" fill="currentColor" />
					</g>
				</svg>
			</div>
		</div>
		%sveltekit.body%
	</div>
</body>

</html>
